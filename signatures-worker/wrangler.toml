name = "justpdfit-signatures"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
SITE_ORIGIN = "https://justpdfit.com"
API_ORIGIN = "https://sign-api.justpdfit.com"
MAIL_FROM = "JustPDFit <signatures@justpdfit.com>"
SIGNATURES_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "justpdfit-signatures"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "justpdfit-signatures"

[triggers]
crons = ["0 2 * * *"]
