name: JustPDFit payment backend tests

on:
  pull_request:
    paths:
      - 'payments/**'
      - '.github/workflows/justpdfit-payments-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax check
        run: node --check payments/worker.js
      - name: Run mocked Stripe integration tests
        run: npm test --prefix payments
